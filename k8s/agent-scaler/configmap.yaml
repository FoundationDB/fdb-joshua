apiVersion: v1
data:
  fdb.cluster: |
    joshua:joshua@172.17.0.1:4500
kind: ConfigMap
metadata:
  name: fdb-cluster-file
  namespace: joshua
---
apiVersion: v1
data:
  joshua-agent.yaml.template: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: joshua-agent-${JOBNAME_SUFFIX}
      namespace: joshua
      labels:
        app: joshua-agent
    spec:
      template:
        metadata:
          labels:
            app: joshua-agent
        spec:
          containers:
          - name: joshua-agent-container
            image: ${AGENT_TAG}
            imagePullPolicy: IfNotPresent
            env:
            - name: AGENT_TIMEOUT
              value: "1800"
            volumeMounts:
              - mountPath: /etc/foundationdb
                readOnly: true
                name: fdb-cluster
          volumes:
            - name: fdb-cluster
              configMap:
                name: fdb-cluster-file
                items:
                  - key: fdb.cluster
                    path: fdb.cluster
          serviceAccountName: joshua-agent-sa
          restartPolicy: Never
          # On SIGTERM the agent kills its test and returns the run to the pool,
          # which takes up to ~20s (JOSHUA_AGENT_SHUTDOWN_TIMEOUT).
          terminationGracePeriodSeconds: 30
kind: ConfigMap
metadata:
  name: joshua-agent-template
  namespace: joshua
